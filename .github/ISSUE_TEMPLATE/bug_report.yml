name: Bug report
description: Something looks wrong, breaks, or runs slowly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: What you were looking at and the steps to get there. A screenshot helps.
  - type: input
    id: setup
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 131 on a Windows laptop with Intel graphics
